<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#f7f5ef'><title>我的减脂日记 V2</title><link rel='manifest' href='./manifest.webmanifest'><style>
:root{--bg:#f7f5ef;--card:#fff;--text:#252822;--muted:#7b7f76;--accent:#69816c;--line:#e8e6df;--danger:#b45c55}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text)}main{max-width:620px;margin:auto;padding:18px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:24px;margin:6px 0 2px}.muted{color:var(--muted);font-size:13px}.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 1px 8px #0000000a}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#f4f5f0;border-radius:16px;padding:12px}.metric b{display:block;font-size:20px;margin-top:5px}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}button,input,select{font:inherit}button{border:0;border-radius:14px;padding:12px;background:#edf0e9;color:var(--text);font-weight:600}.primary{background:var(--accent);color:white}.danger{color:var(--danger)}input,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:white}.meal{border-top:1px solid var(--line);padding:12px 0}.meal:first-of-type{border-top:0}.foodline{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:6px 0}.tabs{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}.tabs button{background:none;max-width:150px;color:var(--muted)}.tabs button.active{color:var(--accent)}section.page{display:none}section.page.active{display:block}.chart{width:100%;height:220px}.pill{display:inline-block;padding:6px 9px;border-radius:12px;background:#eef1eb;font-size:12px}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:10}.modal.show{display:flex}.sheet{background:var(--bg);width:100%;max-width:620px;margin:auto;border-radius:24px 24px 0 0;padding:18px;max-height:88vh;overflow:auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.formgrid label{font-size:12px;color:var(--muted)}.formgrid .full{grid-column:1/-1}h2{font-size:18px;margin:4px 0 12px}canvas{width:100%;height:100%}.seg{display:flex;gap:6px}.seg button{padding:8px 10px;font-size:12px}.seg .on{background:var(--accent);color:#fff}
</style></head><body><main>
<section id='today' class='page active'><div class='top'><div><div class='muted' id='dateLabel'></div><h1>我的减脂日记</h1></div><button onclick='changeDate(-1)'>‹</button><button onclick='changeDate(1)'>›</button></div>
<div class='card'><h2>今日状态</h2><div class='grid'><div class='metric'>摄入<b id='kcal'>0 kcal</b></div><div class='metric'>蛋白质<b id='protein'>0 g</b></div><div class='metric'>碳水<b id='carbs'>0 g</b></div><div class='metric'>脂肪<b id='fat'>0 g</b></div><div class='metric'>总消耗<b id='burn'>—</b></div><div class='metric'>热量差<b id='deficit'>—</b></div><div class='metric'>体重<b id='weight'>—</b></div><div class='metric'>训练<b id='training'>休息</b></div></div><div class='row' style='margin-top:10px'><button onclick='openDayEdit()'>编辑体重/消耗/训练</button></div></div>
<div class='card'><div class='row'><h2 style='margin:0'>饮食</h2><button class='primary' onclick='openFood()'>＋ 添加食物</button></div><div id='meals'></div></div></section>
<section id='trends' class='page'><div class='top'><h1>趋势</h1><div class='seg'><button onclick='setRange(7)' id='r7'>7天</button><button onclick='setRange(14)' id='r14'>14天</button><button onclick='setRange(30)' id='r30'>30天</button></div></div><div class='card'><h2>体重趋势</h2><div class='chart'><canvas id='weightChart'></canvas></div><div class='muted'>虚线：有记录时显示 7 日平均</div></div><div class='card'><h2>热量差趋势</h2><div class='chart'><canvas id='defChart'></canvas></div><div class='muted'>正数 = 热量赤字；负数 = 热量盈余</div></div><div class='card'><h2>营养趋势</h2><div class='chart'><canvas id='macroChart'></canvas></div></div></section>
<section id='history' class='page'><div class='top'><h1>历史</h1><button onclick='exportData()'>导出备份</button></div><div class='card'><input type='file' id='importFile' accept='application/json' onchange='importData(event)'><div class='muted' style='margin-top:6px'>可导入本 V2 导出的 JSON 备份。</div></div><div id='historyList'></div></section>
</main><nav class='tabs'><button class='active' onclick="tab('today',this)">今天</button><button onclick="tab('trends',this)">趋势</button><button onclick="tab('history',this)">历史</button></nav>
<div id='foodModal' class='modal'><div class='sheet'><div class='row'><h2>添加食物</h2><button onclick="closeM('foodModal')">取消</button></div><div class='formgrid'><label class='full'>食物名称<input id='fName'></label><label>餐次<select id='fMeal'><option value='breakfast'>早餐</option><option value='lunch'>午餐</option><option value='snack'>加餐</option><option value='dinner'>晚餐</option></select></label><label>食用量 g / ml / 份<input id='fQty' type='number' value='100'></label><label>热量 kcal / 100单位<input id='fKcal' type='number'></label><label>蛋白质 g / 100单位<input id='fProtein' type='number'></label><label>碳水 g / 100单位<input id='fCarbs' type='number'></label><label>脂肪 g / 100单位<input id='fFat' type='number'></label><label>膳食纤维 g / 100单位<input id='fFiber' type='number'></label><label>计量方式<select id='fBasis'><option value='100'>每100g/ml</option><option value='serving'>每份</option></select></label><label class='full'><input id='saveFood' type='checkbox' checked style='width:auto'> 保存到我的食物</label><div class='full'><select id='savedFoods' onchange='loadSavedFood()'><option value=''>从我的食物选择…</option></select></div><button class='primary full' onclick='addFood()'>确认添加</button></div></div></div>
<div id='dayModal' class='modal'><div class='sheet'><div class='row'><h2>编辑今日数据</h2><button onclick="closeM('dayModal')">取消</button></div><div class='formgrid'><label>体重 kg<input id='dWeight' type='number' step='.1'></label><label>Apple Watch 总消耗 kcal<input id='dBurn' type='number'></label><label class='full'>训练<select id='dTraining'><option>休息</option><option>爬坡</option><option>上肢</option><option>练腿</option><option>私教</option></select></label><button class='primary full' onclick='saveDay()'>保存</button></div></div></div>
<script>
const K='myCutV2'; let state=JSON.parse(localStorage.getItem(K)||'{"days":{},"foods":[]}');let current=new Date();let range=7;const meals=[['breakfast','早餐'],['lunch','午餐'],['snack','加餐'],['dinner','晚餐']];function key(d=current){return d.toISOString().slice(0,10)}function day(k=key()){return state.days[k]||{weight:null,burn:null,training:'休息',meals:{breakfast:[],lunch:[],snack:[],dinner:[]}}}function persist(){localStorage.setItem(K,JSON.stringify(state))}function ensure(){let k=key();if(!state.days[k])state.days[k]=day(k);return state.days[k]}function fmt(n,d=0){return Number(n||0).toFixed(d).replace(/\.0$/,'')}
function totals(d){let a=[].concat(...meals.map(m=>d.meals?.[m[0]]||[]));return a.reduce((s,x)=>({kcal:s.kcal+x.kcal,protein:s.protein+x.protein,carbs:s.carbs+x.carbs,fat:s.fat+x.fat,fiber:s.fiber+x.fiber}),{kcal:0,protein:0,carbs:0,fat:0,fiber:0})}
function render(){let d=day(),t=totals(d);dateLabel.textContent=key();kcal.textContent=fmt(t.kcal)+' kcal';protein.textContent=fmt(t.protein,1)+' g';carbs.textContent=fmt(t.carbs,1)+' g';fat.textContent=fmt(t.fat,1)+' g';burn.textContent=d.burn?d.burn+' kcal':'—';deficit.textContent=d.burn?fmt(d.burn-t.kcal)+' kcal':'—';weight.textContent=d.weight?d.weight+' kg':'—';training.textContent=d.training||'休息';mealsEl=document.getElementById('meals');mealsEl.innerHTML=meals.map(([mk,label])=>`<div class='meal'><b>${label}</b>${(d.meals?.[mk]||[]).map((x,i)=>`<div class='foodline'><span>${x.name} · ${x.qty}${x.basis==='serving'?'份':'g'}</span><span>${fmt(x.kcal)} kcal · P${fmt(x.protein,1)} C${fmt(x.carbs,1)} F${fmt(x.fat,1)} <button class='danger' onclick="delFood('${mk}',${i})">×</button></span></div>`).join('')||'<div class="muted">暂无记录</div>'}</div>`).join('');renderSaved();renderHistory();}
function changeDate(n){current.setDate(current.getDate()+n);render()}function openFood(){document.getElementById('foodModal').classList.add('show')}function closeM(id){document.getElementById(id).classList.remove('show')}function openDayEdit(){let d=day();dWeight.value=d.weight||'';dBurn.value=d.burn||'';dTraining.value=d.training||'休息';dayModal.classList.add('show')}function saveDay(){let d=ensure();d.weight=dWeight.value?+dWeight.value:null;d.burn=dBurn.value?+dBurn.value:null;d.training=dTraining.value;persist();closeM('dayModal');render()}
function addFood(){let q=+fQty.value||0,b=fBasis.value,m=b==='serving'?1:q/100;let rec={name:fName.value||'未命名食物',qty:q,basis:b,kcal:(+fKcal.value||0)*m,protein:(+fProtein.value||0)*m,carbs:(+fCarbs.value||0)*m,fat:(+fFat.value||0)*m,fiber:(+fFiber.value||0)*m};let d=ensure();d.meals[fMeal.value].push(rec);if(saveFood.checked)state.foods.push({name:rec.name,kcal:+fKcal.value||0,protein:+fProtein.value||0,carbs:+fCarbs.value||0,fat:+fFat.value||0,fiber:+fFiber.value||0,basis:b});persist();closeM('foodModal');render()}function delFood(m,i){ensure().meals[m].splice(i,1);persist();render()}function renderSaved(){savedFoods.innerHTML='<option value="">从我的食物选择…</option>'+state.foods.map((x,i)=>`<option value='${i}'>${x.name}</option>`).join('')}function loadSavedFood(){let x=state.foods[+savedFoods.value];if(!x)return;fName.value=x.name;fKcal.value=x.kcal;fProtein.value=x.protein;fCarbs.value=x.carbs;fFat.value=x.fat;fFiber.value=x.fiber;fBasis.value=x.basis}
function tab(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='trends')drawCharts()}function setRange(n){range=n;drawCharts()}function points(){let out=[];for(let i=range-1;i>=0;i--){let dt=new Date();dt.setDate(dt.getDate()-i);let k=key(dt),d=state.days[k]||day(k),t=totals(d);out.push({label:(dt.getMonth()+1)+'/'+dt.getDate(),weight:d.weight,def:d.burn?d.burn-t.kcal:null,protein:t.protein,carbs:t.carbs,fat:t.fat})}return out}
function chart(canvas,series){let c=canvas,ctx=c.getContext('2d'),w=c.clientWidth*devicePixelRatio,h=c.clientHeight*devicePixelRatio;c.width=w;c.height=h;ctx.scale(devicePixelRatio,devicePixelRatio);w=c.clientWidth;h=c.clientHeight;ctx.clearRect(0,0,w,h);let vals=series.flatMap(s=>s.data.filter(v=>v!=null));if(!vals.length){ctx.fillStyle='#7b7f76';ctx.fillText('暂无足够数据',12,30);return}let min=Math.min(...vals),max=Math.max(...vals);if(min===max){min-=1;max+=1}let pad=28;ctx.strokeStyle='#e3e3dc';for(let j=0;j<4;j++){let y=pad+(h-2*pad)*j/3;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke()}series.forEach((s,si)=>{ctx.strokeStyle=['#69816c','#9b755a','#7c7c9c'][si%3];ctx.lineWidth=2;ctx.beginPath();s.data.forEach((v,i)=>{if(v==null)return;let x=pad+(w-2*pad)*(i/(s.data.length-1||1)),y=h-pad-(v-min)/(max-min)*(h-2*pad);i===0||s.data.slice(0,i).every(z=>z==null)?ctx.moveTo(x,y):ctx.lineTo(x,y)});ctx.stroke()});ctx.fillStyle='#7b7f76';ctx.font='11px sans-serif';let p=points();[0,Math.floor((p.length-1)/2),p.length-1].forEach(i=>ctx.fillText(p[i].label,pad+(w-2*pad)*(i/(p.length-1||1))-8,h-7))}
function drawCharts(){[7,14,30].forEach(n=>document.getElementById('r'+n).classList.toggle('on',n===range));let p=points();chart(weightChart,[{data:p.map(x=>x.weight)}]);chart(defChart,[{data:p.map(x=>x.def)}]);chart(macroChart,[{data:p.map(x=>x.protein)},{data:p.map(x=>x.carbs)},{data:p.map(x=>x.fat)}])}
function renderHistory(){let ks=Object.keys(state.days).sort().reverse();historyList.innerHTML=ks.map(k=>{let d=state.days[k],t=totals(d);return `<div class='card'><b>${k}</b><div class='muted' style='margin-top:6px'>${d.weight?d.weight+' kg · ':''}${fmt(t.kcal)} kcal · P ${fmt(t.protein,1)}g · C ${fmt(t.carbs,1)}g · F ${fmt(t.fat,1)}g${d.burn?' · 热量差 '+fmt(d.burn-t.kcal)+' kcal':''}</div></div>`}).join('')||'<div class="card muted">暂无历史记录</div>'}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='我的减脂日记V2备份.json';a.click()}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);persist();render();alert('导入成功')}catch{alert('文件格式不正确')}};r.readAsText(f)}render();
</script></body></html>

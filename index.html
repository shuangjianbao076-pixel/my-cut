<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#f7f5ef'><title>我的减脂日记 V2</title><link rel='manifest' href='./manifest.webmanifest'><style>
:root{--bg:#f7f5ef;--card:#fff;--text:#252822;--muted:#7b7f76;--accent:#69816c;--line:#e8e6df;--danger:#b45c55}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text)}main{max-width:620px;margin:auto;padding:18px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:24px;margin:6px 0 2px}.muted{color:var(--muted);font-size:13px}.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 1px 8px #0000000a}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#f4f5f0;border-radius:16px;padding:12px}.metric b{display:block;font-size:20px;margin-top:5px}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}button,input,select{font:inherit}button{border:0;border-radius:14px;padding:12px;background:#edf0e9;color:var(--text);font-weight:600}.primary{background:var(--accent);color:white}.danger{color:var(--danger)}input,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:white}.meal{border-top:1px solid var(--line);padding:12px 0}.meal:first-of-type{border-top:0}.foodline{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:6px 0}.tabs{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}.tabs button{background:none;max-width:150px;color:var(--muted)}.tabs button.active{color:var(--accent)}section.page{display:none}section.page.active{display:block}.chart{width:100%;height:220px}.pill{display:inline-block;padding:6px 9px;border-radius:12px;background:#eef1eb;font-size:12px}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:10}.modal.show{display:flex}.sheet{background:var(--bg);width:100%;max-width:620px;margin:auto;border-radius:24px 24px 0 0;padding:18px;max-height:88vh;overflow:auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.formgrid label{font-size:12px;color:var(--muted)}.formgrid .full{grid-column:1/-1}h2{font-size:18px;margin:4px 0 12px}canvas{width:100%;height:100%}.seg{display:flex;gap:6px}.seg button{padding:8px 10px;font-size:12px}.seg .on{background:var(--accent);color:#fff}

.foodline{display:grid;grid-template-columns:minmax(0,1fr) 38px;gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid #f0efe9}.foodline:last-child{border-bottom:0}.food-main{min-width:0}.food-title{font-size:15px;font-weight:600;line-height:1.5;overflow-wrap:anywhere}.food-qty{font-weight:400;color:var(--muted);margin-left:8px;white-space:nowrap}.food-energy{font-size:16px;font-weight:600;margin:6px 0;color:var(--accent)}.food-nutrients{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:12px;line-height:1.7}.foodline .danger{width:38px;min-height:38px;padding:8px;border-radius:12px}.metric b{overflow-wrap:anywhere}.version{font-size:11px;color:var(--muted);text-align:center;margin:18px 0}.formgrid input{min-width:0}.sheet{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
</style></head><body><main>
<section id='today' class='page active'><div class='top'><div><div class='muted' id='dateLabel'></div><h1>我的减脂日记</h1></div><button onclick='changeDate(-1)'>‹</button><button onclick='changeDate(1)'>›</button></div>
<div class='card'><h2>今日状态</h2><div class='grid'><div class='metric'>摄入<b id='kcal'>0 kcal</b></div><div class='metric'>蛋白质<b id='protein'>0 g</b></div><div class='metric'>碳水<b id='carbs'>0 g</b></div><div class='metric'>脂肪<b id='fat'>0 g</b></div><div class='metric'>总消耗<b id='burn'>—</b></div><div class='metric'>热量差<b id='deficit'>—</b></div><div class='metric'>体重<b id='weight'>—</b></div><div class='metric'>训练<b id='training'>休息</b></div></div><div class='row' style='margin-top:10px'><button onclick='openDayEdit()'>编辑体重/消耗/训练</button></div></div>
<div class='card'><div class='row'><h2 style='margin:0'>饮食</h2><button class='primary' onclick='openFood()'>＋ 添加食物</button></div><div id='meals'></div></div></section>
<section id='trends' class='page'><div class='top'><h1>趋势</h1><div class='seg'><button onclick='setRange(7)' id='r7'>7天</button><button onclick='setRange(14)' id='r14'>14天</button><button onclick='setRange(30)' id='r30'>30天</button></div></div><div class='card'><h2>体重趋势</h2><div class='chart'><canvas id='weightChart'></canvas></div><div class='muted'>虚线：有记录时显示 7 日平均</div></div><div class='card'><h2>热量差趋势</h2><div class='chart'><canvas id='defChart'></canvas></div><div class='muted'>正数 = 热量赤字；负数 = 热量盈余</div></div><div class='card'><h2>营养趋势</h2><div class='chart'><canvas id='macroChart'></canvas></div></div></section>
<section id='history' class='page'><div class='top'><h1>历史</h1><button onclick='exportData()'>导出备份</button></div><div class='card'><input type='file' id='importFile' accept='application/json' onchange='importData(event)'><div class='muted' style='margin-top:6px'>支持旧版及 V2 的 JSON 备份。导入会替换当前记录；原有数据会先自动留存一份。</div></div><div id='historyList'></div><p class='version'>V2.1 · 单位与旧版数据兼容</p></section>
</main><nav class='tabs'><button class='active' onclick="tab('today',this)">今天</button><button onclick="tab('trends',this)">趋势</button><button onclick="tab('history',this)">历史</button></nav>
<div id='foodModal' class='modal'><div class='sheet'><div class='row'><h2>添加食物</h2><button onclick="closeM('foodModal')">取消</button></div><div class='formgrid'><label class='full'>食物名称<input id='fName'></label><label>餐次<select id='fMeal'><option value='breakfast'>早餐</option><option value='lunch'>午餐</option><option value='snack'>加餐</option><option value='dinner'>晚餐</option></select></label><label>食用数量<input id='fQty' type='number' value='100'></label><label>数量单位<select id='fUnit'><option>g</option><option>ml</option><option>个</option><option>根</option><option>份</option></select></label><label>热量 kcal（按计量方式）<input id='fKcal' type='number'></label><label>蛋白质 g（按计量方式）<input id='fProtein' type='number'></label><label>碳水 g（按计量方式）<input id='fCarbs' type='number'></label><label>脂肪 g（按计量方式）<input id='fFat' type='number'></label><label>膳食纤维 g（按计量方式）<input id='fFiber' type='number'></label><label>计量方式<select id='fBasis'><option value='100'>每100g/ml</option><option value='serving'>每1个 / 根 / 份</option></select></label><label class='full'><input id='saveFood' type='checkbox' checked style='width:auto'> 保存到我的食物</label><div class='full'><select id='savedFoods' onchange='loadSavedFood()'><option value=''>从我的食物选择…</option></select></div><button class='primary full' onclick='addFood()'>确认添加</button></div></div></div>
<div id='dayModal' class='modal'><div class='sheet'><div class='row'><h2>编辑今日数据</h2><button onclick="closeM('dayModal')">取消</button></div><div class='formgrid'><label>体重 kg<input id='dWeight' type='number' step='.1'></label><label>Apple Watch 总消耗 kcal<input id='dBurn' type='number'></label><label class='full'>训练<select id='dTraining'><option>休息</option><option>爬坡</option><option>上肢</option><option>练腿</option><option>私教</option></select></label><button class='primary full' onclick='saveDay()'>保存</button></div></div></div>
<script>
const K='myCutV2';
const meals=[['breakfast','早餐'],['lunch','午餐'],['snack','加餐'],['dinner','晚餐']];
const nutrients=['kcal','protein','carbs','fat','fiber'];
const trainingNames={rest:'休息',incline:'爬坡',upper:'上肢',legs:'练腿',pt:'私教',coach:'私教',personal:'私教',personal_training:'私教'};
function num(v){return v===null||v===undefined||v===''||!Number.isFinite(Number(v))?null:Number(v)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normalize(raw){
 if(!raw||typeof raw!=='object'||!raw.days||typeof raw.days!=='object'||Array.isArray(raw.days)||!Array.isArray(raw.foods))throw Error('数据格式不正确');
 let out={...raw,days:{},foods:raw.foods.map(f=>({...f,basis:f.basis==='serving'?'serving':'100',unit:f.unit||(f.basis==='serving'?'份':'g')}))};
 for(const [k,source] of Object.entries(raw.days)){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!source||typeof source!=='object')throw Error('日期记录格式不正确');
  let d={...source,weight:num(Object.hasOwn(source,'weight')?source.weight:source.weightKg),burn:num(Object.hasOwn(source,'burn')?source.burn:source.totalBurn),training:trainingNames[source.training]||source.training||'休息',meals:{}};
  for(const [mk] of meals){
   let list=source.meals?.[mk]??[];if(!Array.isArray(list))throw Error('餐次格式不正确');
   d.meals[mk]=list.map(x=>{let f=out.foods.find(f=>f.id&&f.id===x.foodId);let unit=x.unit||f?.unit||(x.basis==='serving'?'份':'g');let rec={...x,unit,basis:x.basis==='serving'||f?.basis==='serving'||!['g','ml'].includes(unit)?'serving':'100'};for(const n of nutrients)rec[n]=num(x[n]);return rec});
  }
  out.days[k]=d;
 }
 return out;
}
let raw=localStorage.getItem(K),state,loadFailed=false;try{state=normalize(JSON.parse(raw||'{"days":{},"foods":[]}'))}catch(e){loadFailed=true;state={days:{},foods:[]};alert('本地记录无法读取，原数据仍保留。请先导出备份或联系修复，暂时不要新增记录。');}
let current=new Date(),range=7;
function key(d=current){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function day(k=key()){return state.days[k]||{weight:null,burn:null,training:'休息',meals:{breakfast:[],lunch:[],snack:[],dinner:[]}}}
function persist(){if(loadFailed){alert('请先导入有效备份，原有本地数据已保留');throw Error('读取失败，停止写入')}localStorage.setItem(K,JSON.stringify(state))}
function ensure(){let k=key();if(!state.days[k])state.days[k]=day(k);return state.days[k]}
function fmt(n,d=0){return num(n)===null?'—':Number(n).toFixed(d).replace(/\.0$/,'')}
function nutrientText(n){return num(n)===null?'未记录':fmt(n,1)+'g'}
function totals(d){let a=meals.flatMap(([m])=>d.meals?.[m]||[]),t={};for(const n of nutrients)t[n]=a.length&&a.some(x=>num(x[n])===null)?null:a.reduce((sum,x)=>sum+Number(x[n]),0);return t}
function render(){let d=day(),t=totals(d);dateLabel.textContent=key();kcal.textContent=fmt(t.kcal)+' kcal';protein.textContent=nutrientText(t.protein);carbs.textContent=nutrientText(t.carbs);fat.textContent=nutrientText(t.fat);burn.textContent=d.burn!=null?d.burn+' kcal':'—';deficit.textContent=d.burn!=null&&t.kcal!=null?fmt(d.burn-t.kcal)+' kcal':'—';weight.textContent=d.weight!=null?d.weight+' kg':'—';training.textContent=d.training||'休息';
 document.getElementById('meals').innerHTML=meals.map(([mk,label])=>`<div class='meal'><b>${label}</b>${(d.meals?.[mk]||[]).map((x,i)=>`<div class='foodline'><div class='food-main'><div class='food-title'>${esc(x.name)}<span class='food-qty'>${fmt(x.qty,1)}${esc(x.unit)}</span></div><div class='food-energy'>${fmt(x.kcal)} kcal</div><div class='food-nutrients'><span>蛋白质 ${nutrientText(x.protein)}</span><span>碳水 ${nutrientText(x.carbs)}</span><span>脂肪 ${nutrientText(x.fat)}</span></div></div><button class='danger' aria-label='删除${esc(x.name)}' onclick="delFood('${mk}',${i})">×</button></div>`).join('')||'<div class="muted">暂无记录</div>'}</div>`).join('');renderSaved();renderHistory();}
function changeDate(n){current.setDate(current.getDate()+n);render()}function openFood(){document.getElementById('foodModal').classList.add('show')}function closeM(id){document.getElementById(id).classList.remove('show')}function openDayEdit(){let d=day();dWeight.value=d.weight||'';dBurn.value=d.burn||'';dTraining.value=d.training||'休息';dayModal.classList.add('show')}function saveDay(){let d=ensure();d.weight=dWeight.value?+dWeight.value:null;d.burn=dBurn.value?+dBurn.value:null;d.training=dTraining.value;persist();closeM('dayModal');render()}
function addFood(){let q=num(fQty.value),b=fBasis.value,unit=fUnit.value;if(q===null||q<=0){alert('请填写大于0的食用数量');return}if((b==='100')!==['g','ml'].includes(unit)){alert('g、ml请选择每100g/ml；个、根、份请选择每1个 / 根 / 份');return}let m=b==='serving'?q:q/100;let rec={name:fName.value.trim()||'未命名食物',qty:q,basis:b,unit};let food={name:rec.name,basis:b,unit,defaultQty:q};for(const [n,id] of [['kcal','fKcal'],['protein','fProtein'],['carbs','fCarbs'],['fat','fFat'],['fiber','fFiber']]){let v=num(document.getElementById(id).value);if(v!==null&&v<0){alert('营养数值不能小于0');return}food[n]=v;rec[n]=v===null?null:v*m}let d=ensure();d.meals[fMeal.value].push(rec);if(saveFood.checked)state.foods.push(food);persist();closeM('foodModal');render()}
function delFood(m,i){ensure().meals[m].splice(i,1);persist();render()}
function renderSaved(){savedFoods.innerHTML='<option value="">从我的食物选择…</option>'+state.foods.map((x,i)=>`<option value='${i}'>${esc(x.name)}</option>`).join('')}
function loadSavedFood(){if(savedFoods.value==='')return;let x=state.foods[+savedFoods.value];if(!x)return;fName.value=x.name;fQty.value=x.defaultQty??(x.basis==='serving'?1:100);fUnit.value=x.unit;for(const [n,id] of [['kcal','fKcal'],['protein','fProtein'],['carbs','fCarbs'],['fat','fFat'],['fiber','fFiber']])document.getElementById(id).value=x[n]??'';fBasis.value=x.basis}
function tab(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='trends')drawCharts()}function setRange(n){range=n;drawCharts()}function points(){let out=[];for(let i=range-1;i>=0;i--){let dt=new Date();dt.setDate(dt.getDate()-i);let k=key(dt),d=state.days[k]||day(k),t=totals(d);out.push({label:(dt.getMonth()+1)+'/'+dt.getDate(),weight:d.weight,def:d.burn!=null&&t.kcal!=null?d.burn-t.kcal:null,protein:t.protein,carbs:t.carbs,fat:t.fat})}return out}
function chart(canvas,series){let c=canvas,ctx=c.getContext('2d'),w=c.clientWidth*devicePixelRatio,h=c.clientHeight*devicePixelRatio;c.width=w;c.height=h;ctx.scale(devicePixelRatio,devicePixelRatio);w=c.clientWidth;h=c.clientHeight;ctx.clearRect(0,0,w,h);let vals=series.flatMap(s=>s.data.filter(v=>v!=null));if(!vals.length){ctx.fillStyle='#7b7f76';ctx.fillText('暂无足够数据',12,30);return}let min=Math.min(...vals),max=Math.max(...vals);if(min===max){min-=1;max+=1}let pad=28;ctx.strokeStyle='#e3e3dc';for(let j=0;j<4;j++){let y=pad+(h-2*pad)*j/3;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke()}series.forEach((s,si)=>{ctx.strokeStyle=['#69816c','#9b755a','#7c7c9c'][si%3];ctx.lineWidth=2;ctx.beginPath();s.data.forEach((v,i)=>{if(v==null){ctx.stroke();ctx.beginPath();return}let x=pad+(w-2*pad)*(i/(s.data.length-1||1)),y=h-pad-(v-min)/(max-min)*(h-2*pad);i===0||s.data[i-1]==null?ctx.moveTo(x,y):ctx.lineTo(x,y)});ctx.stroke()});ctx.fillStyle='#7b7f76';ctx.font='11px sans-serif';let p=points();[0,Math.floor((p.length-1)/2),p.length-1].forEach(i=>ctx.fillText(p[i].label,pad+(w-2*pad)*(i/(p.length-1||1))-8,h-7))}
function drawCharts(){[7,14,30].forEach(n=>document.getElementById('r'+n).classList.toggle('on',n===range));let p=points();chart(weightChart,[{data:p.map(x=>x.weight)}]);chart(defChart,[{data:p.map(x=>x.def)}]);chart(macroChart,[{data:p.map(x=>x.protein)},{data:p.map(x=>x.carbs)},{data:p.map(x=>x.fat)}])}
function renderHistory(){let ks=Object.keys(state.days).sort().reverse();historyList.innerHTML=ks.map(k=>{let d=state.days[k],t=totals(d);return `<div class='card'><b>${esc(k)}</b><div class='muted' style='margin-top:6px;line-height:1.8'>${d.weight!=null?fmt(d.weight,1)+' kg · ':''}${fmt(t.kcal)} kcal<br>蛋白质 ${nutrientText(t.protein)} · 碳水 ${nutrientText(t.carbs)} · 脂肪 ${nutrientText(t.fat)}${d.burn!=null&&t.kcal!=null?'<br>总消耗 '+fmt(d.burn)+' kcal · 热量差 '+fmt(d.burn-t.kcal)+' kcal':''}</div></div>`}).join('')||'<div class="card muted">暂无历史记录</div>'}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='我的减脂日记V2备份.json';a.click()}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let next=normalize(JSON.parse(r.result));if(!confirm('导入将替换当前记录，继续吗？'))return;let previous=localStorage.getItem(K);if(previous)localStorage.setItem(K+'_beforeImport',previous);localStorage.setItem(K,JSON.stringify(next));state=next;loadFailed=false;render();alert('导入成功，旧版单位、体重和消耗已兼容')}catch{alert('文件格式不正确或设备存储空间不足，未导入')}};r.readAsText(f)}render();
</script></body></html>
